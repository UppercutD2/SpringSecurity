<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Registration Page</title>
</head>
<body>

<form th:method="POST" th:action="@{/authenticate/registration}" th:object="${person}">

        <label for="username"> Enter Username: </label>
        <input type="text"  th:field="*{username}" id="username">
        <div style="color:red" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"> Username error</div>
        <br/>

        <label for="birthYear"> Enter Year_Of_Birth: </label>
        <input type="text" th:field="*{birthYear}" id="birthYear">
        <div style="color:red" th:if="${#fields.hasErrors('birthYear')}" th:errors="*{birthYear}"> Year_Of_Birth error</div>
        <br/>

        <label for="password"> Enter Password: </label>
        <input type="password" th:field="*{password}" id="password">
        <div style="color:red" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"> Password error</div>
        <br/>
        <input type="submit" value="Sign up!"/>
</form>

</body>
</html>
